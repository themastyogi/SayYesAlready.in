<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading... 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:#FFF6EE;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;}
.wrap{text-align:center;}
.em{font-size:56px;margin-bottom:14px;animation:pulse 1.4s ease infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
h1{font-size:28px;color:#4A2E3A;margin-bottom:6px;}
p{font-size:14px;color:#b69aa3;}
</style>
</head>
<body>
<div class="wrap">
  <div class="em">💌</div>
  <h1>Loading...</h1>
  <p>taking you to the right place</p>
</div>
<script>
  /* If user has a session → go to dashboard
     If user has a pending trip link → go to roadtrip
     Otherwise → go to dashboard (dashboard handles new users with login) */
  (function(){
    /* preserve any query params / hash for roadtrip links */
    const params = new URLSearchParams(window.location.search);
    if(params.get('trip')){
      window.location.replace('roadtrip.html' + window.location.search);
      return;
    }
    if(window.location.hash && window.location.hash.startsWith('#room=')){
      window.location.replace('date.html' + window.location.hash);
      return;
    }
    if(window.location.hash && window.location.hash.startsWith('#group=')){
      window.location.replace('dashboard.html' + window.location.hash);
      return;
    }
    /* everyone else → dashboard */
    window.location.replace('dashboard.html');
  })();
</script>
</body>
</html>
